# Fork only: builds the production image and keeps it as a downloadable artifact (no registry, no secrets).
# Download with `gh run download` and load it on the server with `docker load`.
name: fork-image

on:
  push:
    branches: [deploy-image]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: arcreel-fork:${{ github.sha }}
          outputs: type=docker,dest=/tmp/arcreel-fork.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compress
        run: gzip -1 /tmp/arcreel-fork.tar && ls -lh /tmp/arcreel-fork.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: arcreel-fork-image
          path: /tmp/arcreel-fork.tar.gz
          retention-days: 3
          compression-level: 0
